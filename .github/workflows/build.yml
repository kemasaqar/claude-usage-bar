name: Build

# Every push: test and build the app (the zip is kept as a workflow artifact).
# A release publishes dist/ClaudeUsageBar.zip to a GitHub Release, which is
# what install.sh downloads. There's one:
#   - when a pull request is merged into main (scripts/release-version.sh
#     picks the version from its labels; docs-only changes aren't released),
#   - when you push a tag like v2.0.0 yourself.
# A plain push to main, without a pull request, isn't released.
on:
  push:
    branches: [swift, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Merges are released one at a time, so two can't claim the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The pull request this push merged, if any.
          PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            -q "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\")][0].number // empty")"
          if [ -z "$PR" ]; then
            echo "Not a merged pull request: no release"
            exit 0
          fi
          VERSION="$(
            TAGS="$(git tag -l)" \
            LABELS="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q '.labels[].name')" \
            FILES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')" \
            scripts/release-version.sh
          )"
          echo "Pull request #$PR: ${VERSION:-no release}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build app
        # The release's version; otherwise the last tag (build-app.sh's default).
        run: scripts/build-app.sh "${{ steps.release.outputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar
          path: dist/ClaudeUsageBar.zip

      - name: Publish release
        if: steps.release.outputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version || github.ref_name }}
        # For a merge this also creates the tag, on the merged commit. A tag
        # made with this token doesn't start another run, so nothing is
        # published twice.
        run: |
          gh release create "$VERSION" dist/ClaudeUsageBar.zip \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
